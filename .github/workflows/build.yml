name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build boot.img
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up environment
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update -y
        sudo apt-get install -y openjdk-11-jdk git-core gnupg flex bison build-essential zip
        curl zlib1g-dev gcc-multilib g++-multilib libc6-dev:i386
        x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip
        fontconfig python3 bc libssl-dev rsync schedtool repo
        
    - name: Initialize Repo
      run: |
        mkdir -p device/xiaomi/camellia
        git clone https://github.com/Vertuozer/device_xiaomi_camellia-twrp.git device/xiaomi/camellia
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp -b twrp-12.1 --depth=1
        repo sync -j$(nproc) —force-sync —current-branch —no-tags —no-clone-bundle —optimized-fetch —prune

    - name: Build TWRP
      run: |
        . build/envsetup.sh
        lunch aosp_camellia-eng
        mka bootimage

    - name: Archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_Artifacts
        path: |
          out/target/product/camellia/boot.img
